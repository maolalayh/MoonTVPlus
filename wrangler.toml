name = "moontv-plus"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "./cloudflare-worker.ts"
minify = true
# 保留 dashboard 上已设置的变量（UPSTASH_URL/UPSTASH_TOKEN/USERNAME/PASSWORD 等），
# 避免 wrangler deploy 用 [vars] 覆盖掉，导致凭据落到本地磁盘。
keep_vars = true

# 静态资源配置
# Cloudflare Workers Assets 用于服务静态文件
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# 本实例存储后端为 Upstash，账号下无 D1 数据库，故移除 [[d1_databases]] 段。

# 观影室的 Durable Object。
# 单个 hub DO 装下所有房间：客户端是先建连、后 emit room:create/join，
# 建连那一刻拿不到 roomId，所以没法按房间做 idFromName 路由。
[[durable_objects.bindings]]
name = "WATCH_ROOM"
class_name = "WatchRoomHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WatchRoomHub"]

# 定时任务（对齐 vercel.json 的 "0 1 * * *"）。
# 触发器要想生效，入口必须导出 scheduled —— 见 cloudflare-worker.ts。
[triggers]
crons = ["0 1 * * *"]

# 注意：[vars] 必须留在文件最后。
# cloudflare-deploy.yml 是用 `echo >> wrangler.toml` 追加环境变量的，
# 追加的变量会落在文件末尾 —— 只有 [vars] 在最后它们才会进 [vars]。
[vars]
NODE_ENV = "production"
BUILD_TARGET = "cloudflare"
# 与线上现网一致（原 Worker 上为 plain_text 变量）
NEXT_PUBLIC_STORAGE_TYPE = "upstash"
# cron 路由等任务真正结束再返回（CF 上不需要 Vercel 那套"先返回 202 再后台跑"）
CRON_WAIT_FOR_COMPLETION = "true"
